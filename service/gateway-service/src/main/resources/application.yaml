spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
#          globalcors:
#            add-to-simple-url-handler-mapping: true
#            cors-configurations:
#              '[/**]':
#                allowed-origins: "*"
#                allowed-methods:
#                  - GET
#                  - POST
#                  - PUT
#                  - PATCH
#                  - DELETE
#                  - OPTIONS
#                allowed-headers: "*"

          routes:

            - id: movie-service
              uri: http://localhost:51100
              predicates:
                - Path=/api/v1/movies/**,/api/v1/screenings/**

            - id: booking-service
              uri: http://localhost:51200
              predicates:
                - Path=/api/v1/bookings,/api/v1/bookings/**

            - id: movie-docs
              uri: http://localhost:51100
              predicates:
                - Path=/movie-service/v3/api-docs/**
              filters:
                - RewritePath=/movie-service/(?<path>.*), /$\{path}

            - id: booking-docs
              uri: http://localhost:51200
              predicates:
                - Path=/booking-service/v3/api-docs/**
              filters:
                - RewritePath=/booking-service/(?<path>.*), /$\{path}

springdoc:
  swagger-ui:
    path: /swagger
    urls:
      - name: Movie Service API
        url: /movie-service/v3/api-docs
        displayName: Movie Service
      - name: Booking Service API
        url: /booking-service/v3/api-docs
        displayName: Booking Service
  api-docs:
    enabled: true