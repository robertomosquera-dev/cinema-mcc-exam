spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5432/bookingdb}
    username: ${BOOKING_DB_USERNAME:root}
    password: ${BOOKING_DB_PASSWORD:1134}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none

server:
  port: ${BOOKING_PORT:51200}

movie-service:
  base-url: ${MOVIE_SERVICE_URL:http://localhost:51100/api/v1}
  reserve:
    max-attempts: 3
    retry-delay-ms: 500

